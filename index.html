<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>10A9 - THPT HÒA BÌNH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background: #0a0a1a; 
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; }

    /* ===== MÀN HÌNH CHÀO ===== */
    #welcomeScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1000;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      transition: opacity 0.8s ease;
    }
    #welcomeScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .warning-icon { font-size: 72px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    #warningText {
      color: #ff4444;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 68, 68, 0.3);
      letter-spacing: 2px;
      max-width: 700px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    #warningText .highlight { color: #ffaa00; background: rgba(255,170,0,0.15); padding: 2px 10px; border-radius: 8px; }
    #warningText .cấm {
      color: #ff2222;
      background: rgba(255,0,0,0.2);
      padding: 2px 10px;
      border-radius: 8px;
      border: 2px solid #ff2222;
      animation: blinkBorder 1s infinite;
    }
    @keyframes blinkBorder {
      0%, 100% { border-color: #ff2222; }
      50% { border-color: transparent; }
    }

    .instruction-icons {
      display: flex;
      gap: 40px;
      margin: 20px 0 30px;
      color: #aaa;
      font-size: 16px;
    }
    .instruction-icons span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .instruction-icons .icon-big { font-size: 40px; }
    .instruction-icons .label { font-size: 14px; color: #888; }

    #watchBtn {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white;
      border: none;
      padding: 18px 60px;
      border-radius: 60px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 40px rgba(255, 68, 68, 0.3);
      text-transform: uppercase;
      margin-top: 10px;
    }
    #watchBtn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 68, 68, 0.5); }
    #watchBtn:active { transform: scale(0.95); }
    #footerNote { color: #333; font-size: 12px; margin-top: 30px; letter-spacing: 1px; }

    /* ===== ADMIN PANEL ===== */
    #adminPanel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(15px);
      padding: 20px 25px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      min-width: 250px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      transition: 0.3s;
      display: none;
    }
    #adminPanel.active { display: block; }
    #adminPanel:hover { border-color: rgba(100, 200, 255, 0.3); }
    
    #adminPanel h3 {
      font-size: 14px;
      color: #88ddff;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 10px;
    }
    
    #adminPanel label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin: 12px 0 5px;
      font-weight: 300;
    }
    
    #adminPanel input[type="file"] {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    #adminPanel input[type="file"]:hover {
      background: rgba(255,255,255,0.1);
      border-color: #88ddff;
    }
    #adminPanel input[type="file"]::file-selector-button {
      background: #2a2a5a;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 10px;
    }
    
    #adminPanel textarea {
      width: 100%;
      height: 60px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: white;
      padding: 10px;
      font-size: 13px;
      resize: vertical;
      font-family: inherit;
      margin-top: 8px;
      transition: 0.3s;
    }
    #adminPanel textarea:focus {
      outline: none;
      border-color: #88ddff;
      background: rgba(255,255,255,0.08);
    }
    #adminPanel textarea::placeholder { color: #555; }
    
    #adminStatus {
      font-size: 11px;
      color: #0f0;
      margin-top: 12px;
      text-align: center;
      opacity: 0.7;
    }

    /* ===== GHI CHÚ ===== */
    #noteDisplay {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 14px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      max-width: 80%;
      text-align: center;
      pointer-events: none;
      font-weight: 300;
      letter-spacing: 0.5px;
      transition: 0.5s;
    }
    #noteDisplay:empty { opacity: 0; }

    #viewerHint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      color: rgba(255,255,255,0.15);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
      background: rgba(0,0,0,0.3);
      padding: 8px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.03);
      display: none;
    }
    #viewerHint.show { display: block; }

    #adminToggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.08);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
      letter-spacing: 1px;
      display: none;
    }
    #adminToggle.show { display: block; }
    #adminToggle:hover {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.3);
    }

    @media (max-width: 768px) {
      #warningText { font-size: 20px; padding: 0 10px; }
      .warning-icon { font-size: 50px; }
      #watchBtn { padding: 14px 40px; font-size: 18px; }
      .instruction-icons { gap: 20px; }
      .instruction-icons .icon-big { font-size: 30px; }
      #adminPanel {
        top: 10px;
        right: 10px;
        padding: 15px;
        min-width: 180px;
        max-width: 85vw;
      }
      #noteDisplay { font-size: 13px; padding: 10px 20px; bottom: 20px; }
    }
  </style>
</head>

    <div class="warning-icon">🏫</div>
    <div id="warningText">

  <div id="adminPanel">

  <!-- ===== GHI CHÚ ===== -->
  <div id="noteDisplay"></div>

  <!-- ===== THREE.JS ===== -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ============ DANH SÁCH TÊN ============
    const nameList = [
      "Minh Anh", "Ngọc Anh", "Mai Anh", "Gia Bảo", "Thiên Bảo",
      "Hải Đăng", "Tấn Đạt", "Thanh Ngọc Diệp", "Quốc Dũng", "Thùy Dương",
      "Ánh Dương", "Thùy Ngân Hà", "Ngọc Bảo Hân", "Hoàng", "Mai Bảo Hoàng",
      "Tấn Hưng", "Trọng Khang", "Duy Kiệt", "Thùy Lam", "Thị Linh Lan",
      "Phương Linh", "Ngọc Phương Linh", "Khánh Ly", "Thảo My", "Nam",
      "Kim Ngân", "Bích Ngọc", "Giáng Ngọc", "Thảo Nguyên", "Diễm Quyên",
      "Như Quỳnh", "Nhật Anh Thi", "Thiên Thiên", "Anh Thư", "Khánh Thư",
      "Đình Toàn", "Ngọc Bảo Trâm", "Hữu Trung", "Viết Trung",
      "Duy Tường", "Vũ", "Khả Vy", "Yến Vy", "Như Ý"
    ];

    // ============ DOM ============
    const welcomeScreen = document.getElementById('welcomeScreen');
    const watchBtn = document.getElementById('watchBtn');
    const viewerHint = document.getElementById('viewerHint');
    const adminToggle = document.getElementById('adminToggle');
    const adminPanel = document.getElementById('adminPanel');
    const noteDisplay = document.getElementById('noteDisplay');
    const noteInput = document.getElementById('noteInput');

    // ============ BIẾN ============
    let scene, camera, renderer, labelRenderer, controls;
    let heartMesh, heartGlow;
    let nameObjects = [];
    let smallTextObjects = [];
    let cloudObjects = [];
    let particleSystem;
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let isPlaying = false;
    let sourceNode = null;
    let is3DReady = false;
    let time = 0;

    // ============ BẤM XEM VIDEO ============
    watchBtn.addEventListener('click', function() {
      console.log('🎬 Bấm XEM VIDEO');
      
      welcomeScreen.classList.add('hidden');
      viewerHint.classList.add('show');
      adminToggle.classList.add('show');
      
      if (!is3DReady) {
        console.log('🚀 Khởi tạo 3D...');
        init3D();
        is3DReady = true;
      }
      
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().then(() => {
          console.log('✅ AudioContext resumed');
          if (sourceNode && !isPlaying) {
            try {
              sourceNode.start(0);
              isPlaying = true;
              document.getElementById('adminStatus').textContent = '🎵 Đang phát nhạc!';
              document.getElementById('adminStatus').style.color = '#0f0';
            } catch(e) {}
          }
        });
      }
    });

    // ============ TẠO GLOW TEXTURE ============
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.2, 'rgba(255,200,255,0.8)');
      gradient.addColorStop(0.5, 'rgba(255,150,255,0.3)');
      gradient.addColorStop(1, 'rgba(255,100,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    // ============ TẠO TRÁI TIM 3D ============
    function createHeart3D() {
      // Tạo shape trái tim
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      const s = 1.2;
      
      shape.moveTo(x, y + 0.3 * s);
      shape.bezierCurveTo(x - 0.3 * s, y + 0.6 * s, x - 0.6 * s, y + 0.3 * s, x, y);
      shape.bezierCurveTo(x + 0.6 * s, y + 0.3 * s, x + 0.3 * s, y + 0.6 * s, x, y + 0.3 * s);
      
      const extrudeSettings = {
        steps: 2,
        depth: 0.8,
        bevelEnabled: true,
        bevelThickness: 0.15,
        bevelSize: 0.08,
        bevelSegments: 8,
      };
      
      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();
      
      // Tạo texture chữ trên trái tim
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      
      // Nền gradient hồng đậm
      const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 500);
      grad.addColorStop(0, '#ff2266');
      grad.addColorStop(0.3, '#ee1155');
      grad.addColorStop(0.7, '#cc0044');
      grad.addColorStop(1, '#880033');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Viền sáng
      ctx.shadowColor = '#ff4488';
      ctx.shadowBlur = 30;
      ctx.strokeStyle = '#ff6699';
      ctx.lineWidth = 4;
      ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
      
      // Chữ chính
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff4488';
      ctx.shadowBlur = 60;
      
      // Dòng 1: 10A9
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 180px Arial Black, sans-serif';
      ctx.shadowBlur = 80;
      ctx.fillText('10A9', canvas.width/2, canvas.height/2 - 80);
      
      // Dòng 2: THPT HÒA BÌNH
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#ffdd99';
      ctx.font = 'bold 70px Arial, sans-serif';
      ctx.fillText('THPT HÒA BÌNH', canvas.width/2, canvas.height/2 + 110);
      
      // Dòng 3: 2026
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = 'bold 36px Arial, sans-serif';
      ctx.fillText('2026', canvas.width/2, canvas.height - 50);
      
      const texture = new THREE.CanvasTexture(canvas);
      
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.2,
        metalness: 0.3,
        emissive: new THREE.Color(0xff2266),
        emissiveIntensity: 0.3,
        side: THREE.DoubleSide,
      });
      
      const heart = new THREE.Mesh(geometry, material);
      heart.scale.set(1.8, 1.8, 1.8);
      heart.castShadow = true;
      heart.receiveShadow = true;
      
      // Lớp glow bao quanh trái tim
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xff4488,
        transparent: true,
        opacity: 0.06,
        wireframe: true,
      });
      const glowGeom = new THREE.SphereGeometry(1.6, 16, 16);
      heartGlow = new THREE.Mesh(glowGeom, glowMat);
      heart.add(heartGlow);
      
      // Lớp glow thứ 2
      const glowMat2 = new THREE.MeshBasicMaterial({
        color: 0xff88aa,
        transparent: true,
        opacity: 0.03,
        wireframe: true,
      });
      const glowGeom2 = new THREE.SphereGeometry(2.0, 16, 16);
      const heartGlow2 = new THREE.Mesh(glowGeom2, glowMat2);
      heart.add(heartGlow2);
      
      // Sprite glow
      const spriteMat = new THREE.SpriteMaterial({
        map: createGlowTexture(),
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.3,
        color: 0xff4488,
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(4, 4, 1);
      heart.add(sprite);
      
      return heart;
    }

    // ============ TẠO MÂY ============
    function createCloud() {
      const group = new THREE.Group();
      const numPuffs = 4 + Math.floor(Math.random() * 3);
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x4488ff,
        emissiveIntensity: 0.03,
        transparent: true,
        opacity: 0.2 + Math.random() * 0.15,
        roughness: 0.1,
        metalness: 0.0,
      });
      
      for (let i = 0; i < numPuffs; i++) {
        const size = 0.4 + Math.random() * 0.6;
        const geom = new THREE.SphereGeometry(size, 8, 8);
        const puff = new THREE.Mesh(geom, material);
        puff.position.set(
          (Math.random() - 0.5) * 2.0,
          (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 2.0
        );
        puff.scale.y = 0.5 + Math.random() * 0.5;
        group.add(puff);
      }
      
      const scale = 1.0 + Math.random() * 1.0;
      group.scale.set(scale, scale * 0.6, scale);
      group.userData = {
        speed: 0.08 + Math.random() * 0.15,
        angle: Math.random() * Math.PI * 2,
        radius: 5 + Math.random() * 4,
        height: (Math.random() - 0.5) * 3 + 1.5,
      };
      
      return group;
    }

    // ============ TẠO TÊN HỌC SINH BAY ============
    function createNameLabel(text, color = '#ff66aa', fontSize = '20px') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.color = color;
      div.style.fontFamily = "'Segoe UI', Arial, sans-serif";

      div.style.backdropFilter = 'blur(5px)';

    }

    // ============ TẠO CHỮ "10A9" NHỎ BAY GẦN TIM ============
    function createSmallText(text, color = '#ff8844', fontSize = '14px') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.color = color;
      div.style.fontFamily = "'Arial Black', 'Segoe UI', sans-serif";
      div.style.fontSize = fontSize;
      div.style.fontWeight = '900';
      div.style.textShadow = `
        0 0 10px ${color},
        0 0 20px ${color},
        0 0 40px ${color}
      `;
      div.style.background = 'rgba(255,136,68,0.08)';
      div.style.padding = '3px 12px';
      div.style.borderRadius = '16px';
      div.style.border = '1px solid rgba(255,136,68,0.15)';
      div.style.backdropFilter = 'blur(5px)';
      div.style.letterSpacing = '2px';
      div.style.whiteSpace = 'nowrap';
      div.style.opacity = '0.5';
      
      const label = new CSS2DObject(div);
      
      label.userData = {
        angle: Math.random() * Math.PI * 2,
        radius: 2.0 + Math.random() * 0.5,
        height: (Math.random() - 0.5) * 1.8,
        speed: 0.5 + Math.random() * 0.3,
        rotSpeed: 0.02,
        phase: Math.random() * Math.PI * 2,
      };
      
      return label;
    }

    // ============ TẠO HẠT SÁNG ============
    function createParticles() {
      const count = 500;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 3 + Math.random() * 4;
        
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        
        const c = new THREE.Color().setHSL(0.9 + Math.random() * 0.1, 1, 0.5 + Math.random() * 0.3);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }
      
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      
      const material = new THREE.PointsMaterial({
        size: 0.05,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
      });
      
      const particles = new THREE.Points(geometry, material);
      return particles;
    }

    // ============ KHỞI TẠO 3D ============
    function init3D() {
      // ----- SCENE -----
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);

      // ----- CAMERA -----
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(4, 3, 7);
      camera.lookAt(0, 0, 0);

      // ----- RENDERER -----
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      // ----- LABEL RENDERER -----
      labelRenderer = new CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = 'absolute';
      labelRenderer.domElement.style.top = '0px';
      labelRenderer.domElement.style.left = '0px';
      labelRenderer.domElement.style.pointerEvents = 'none';
      document.body.appendChild(labelRenderer.domElement);

      // ----- CONTROLS -----
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.autoRotate = false;
      controls.enableZoom = true;
      controls.rotateSpeed = 0.8;
      controls.target.set(0, 0, 0);
      controls.update();

      // ----- LIGHTS -----
      const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(5, 8, 6);
      mainLight.castShadow = true;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xff4488, 0.6);
      fillLight.position.set(-4, 2, -3);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x4488ff, 0.4);
      rimLight.position.set(0, -3, 5);
      scene.add(rimLight);

      // ===== TRÁI TIM 3D =====
      heartMesh = createHeart3D();
      scene.add(heartMesh);

      // ===== HẠT SÁNG =====
      particleSystem = createParticles();
      scene.add(particleSystem);

      // ===== TẠO TÊN HỌC SINH BAY =====
      const colors = ['#ff66aa', '#ff88bb', '#ff44aa', '#ff99cc', '#ff55bb', '#ff77aa', '#ff66cc', '#ff88dd'];
      
      nameList.forEach((name, index) => {
        const color = colors[index % colors.length];
        const label = createNameLabel(name, color, '22px');
        
        const angle = (index / nameList.length) * Math.PI * 2 + 0.3;
        const radius = 3.8 + Math.random() * 1.2;
        const height = (Math.random() - 0.5) * 3.2;
        
        label.userData.angle = angle;
        label.userData.radius = radius;
        label.userData.height = height;
        label.userData.speed = 0.12 + Math.random() * 0.12;
        
        label.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius
        );
        
        scene.add(label);
        nameObjects.push(label);
      });

      // ===== TẠO CHỮ "10A9" NHỎ BAY GẦN TIM =====
      const smallTexts = [
        "10A9", "10A9", "10A9", "10A9", "10A9",
        "10A9", "10A9", "10A9", "10A9", "10A9",
        "10A9", "10A9", "10A9", "10A9", "10A9",
        "10A9", "10A9", "10A9", "10A9", "10A9"
      ];
      
      smallTexts.forEach((text, index) => {
        const colors2 = ['#ff8844', '#ff9944', '#ffaa55', '#ffbb66', '#ffcc77'];
        const color = colors2[index % colors2.length];
        const label = createSmallText(text, color, '14px');
        
        const angle = (index / smallTexts.length) * Math.PI * 2 + 0.5;
        const radius = 2.2 + Math.random() * 0.4;
        const height = (Math.random() - 0.5) * 1.8;
        
        label.userData.angle = angle;
        label.userData.radius = radius;
        label.userData.height = height;
        label.userData.speed = 0.5 + Math.random() * 0.3;
        
        label.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius
        );
        
        scene.add(label);
        smallTextObjects.push(label);
      });

      // ===== TẠO MÂY =====
      for (let i = 0; i < 6; i++) {
        const cloud = createCloud();
        const angle = Math.random() * Math.PI * 2;
        const radius = 5 + Math.random() * 4;
        cloud.position.set(
          Math.cos(angle) * radius,
          (Math.random() - 0.5) * 2 + 1.5,
          Math.sin(angle) * radius
        );
        cloud.userData.angle = angle;
        cloud.userData.radius = radius;
        scene.add(cloud);
        cloudObjects.push(cloud);
      }

      // ===== LOAD SAVED =====
      loadSavedData();

      // ===== AUDIO CONTEXT =====
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      console.log('🎵 AudioContext created');

      // ===== START ANIMATION =====
      animate();
      console.log('✅ 3D initialized!');
    }

    // ============ LOAD SAVED ============
    function loadSavedData() {
      const savedNote = localStorage.getItem('cubeNote');
      if (savedNote) {
        noteInput.value = savedNote;
        noteDisplay.textContent = savedNote;
      }
    }

    // ============ HỆ THỐNG ÂM THANH ============
    async function initAudio(file) {
      try {
        if (sourceNode) {
          try { sourceNode.stop(); } catch(e) {}
          sourceNode = null;
        }
        isPlaying = false;

        const arrayBuffer = await file.arrayBuffer();
        if (!audioContext || audioContext.state === 'closed') {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        sourceNode = audioContext.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = true;
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
        
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        
        sourceNode.start(0);
        isPlaying = true;
        
        document.getElementById('adminStatus').textContent = '🎵 Đang phát: ' + file.name;
        document.getElementById('adminStatus').style.color = '#0f0';
        console.log('🎵 Đang phát nhạc!');
        
      } catch (err) {
        console.error('❌ Lỗi âm thanh:', err);
        document.getElementById('adminStatus').textContent = '❌ Lỗi: ' + err.message;
        document.getElementById('adminStatus').style.color = '#f44';
        isPlaying = false;
      }
    }

    // ============ XỬ LÝ SỰ KIỆN ADMIN ============
    document.getElementById('musicInput').addEventListener('change', function(e) {
      if (this.files.length > 0) initAudio(this.files[0]);
    });

    noteInput.addEventListener('input', function() {
      const note = this.value;
      noteDisplay.textContent = note;
      localStorage.setItem('cubeNote', note);
    });

    // ============ BẬT ADMIN ============
    let clickCount = 0;
    let clickTimer = null;
    
    adminToggle.addEventListener('click', function() {
      clickCount++;
      if (clickTimer) clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
      
      if (clickCount >= 3) {
        adminPanel.classList.toggle('active');
        clickCount = 0;
        const status = document.getElementById('adminStatus');
        if (adminPanel.classList.contains('active')) {
          status.textContent = '🔓 Admin mode ON';
          status.style.color = '#ff0';
        } else {
          status.textContent = '🔒 Admin mode OFF';
          status.style.color = '#0f0';
        }
      }
    });

    // ============ ANIMATION ============
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      // Trái tim xoay và nhảy
      if (heartMesh) {
        heartMesh.rotation.x += 0.003;
        heartMesh.rotation.y += 0.006;
        heartMesh.rotation.z += 0.002;
        
        if (heartGlow) {
          heartGlow.material.opacity = 0.05 + Math.sin(time * 0.5) * 0.03;
        }
        
        if (isPlaying && analyser && dataArray) {
          analyser.getByteFrequencyData(dataArray);
          
          let bass = 0;
          const len = dataArray.length;
          for (let i = 0; i < len * 0.3; i++) {
            bass += dataArray[i];
          }
          bass = bass / (len * 0.3) / 255;
          
          const bounceHeight = (bass - 0.1) * 0.5;
          heartMesh.position.y = Math.max(0, bounceHeight);
          const scaleHeart = 1 + bass * 0.04;
          heartMesh.scale.set(
            1.8 * scaleHeart,
            1.8 * scaleHeart,
            1.8 * scaleHeart
          );
        }
      }

      // ===== TÊN HỌC SINH BAY =====
      nameObjects.forEach((label) => {
        const data = label.userData;
        data.angle += data.speed * 0.025;
        const radius = data.radius + Math.sin(time * data.speed * 0.8 + data.phase) * 0.3;
        label.position.x = Math.cos(data.angle) * radius;
        label.position.z = Math.sin(data.angle) * radius;
        label.position.y = data.height + Math.sin(time * data.speed * 0.6 + data.phase) * 0.5;
        label.rotation.y += data.rotSpeed || 0.01;
      });

      // ===== CHỮ "10A9" NHỎ BAY GẦN TIM =====
      smallTextObjects.forEach((label) => {
        const data = label.userData;
        data.angle += data.speed * 0.03;
        const radius = data.radius + Math.sin(time * data.speed * 1.5 + data.phase) * 0.15;
        label.position.x = Math.cos(data.angle) * radius;
        label.position.z = Math.sin(data.angle) * radius;
        label.position.y = data.height + Math.sin(time * data.speed * 1.2 + data.phase) * 0.2;
        label.rotation.y += data.rotSpeed || 0.02;
      });

      // ===== HẠT SÁNG =====
      if (particleSystem) {
        particleSystem.rotation.y += 0.001;
        particleSystem.rotation.x += 0.0005;
      }

      // ===== MÂY =====
      cloudObjects.forEach((cloud) => {
        const data = cloud.userData;
        data.angle += data.speed * 0.005;
        cloud.position.x = Math.cos(data.angle) * data.radius;
        cloud.position.z = Math.sin(data.angle) * data.radius;
        cloud.rotation.y += 0.001;
      });

      controls.update();
      
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    // ============ RESIZE ============
    window.addEventListener('resize', () => {
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      if (renderer) {
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      if (labelRenderer) {
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    console.log('🎯 HƯỚNG DẪN:');
    console.log('1️⃣ Bấm "XEM VIDEO" để bắt đầu');
    console.log('2️⃣ Kéo chuột xoay không gian');
    console.log('3️⃣ Admin: Click 3 lần vào ⚙️ để mở panel');
    console.log('4️⃣ Chọn nhạc của bạn');
  </script>
</body>
</html>
